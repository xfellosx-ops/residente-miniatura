<script id="eng">
"use strict";
const SRC_HTML="<!DOCTYPE html>"+document.documentElement.outerHTML;
const LEVELS=__LEVELS__, REGIONS=__REGIONS__, TEMARIO=__TEMARIO__, COMPET=__COMPET__;
/* nivel en curso: el que eligió el mapa (rm_cur) o el primero del archivo */
const CUR=(()=>{try{return localStorage.getItem("rm_cur")}catch(e){return null}})();
const LV=LEVELS.find(l=>l.story.meta.id===CUR)||LEVELS[0];
const STORY=LV.story,Q1=LV.q1||{},Q2=LV.q2||{},BANK=LV.bank||[];
/* progreso global entre niveles: equipo, caja y niveles superados */
const GKEY="rm_global";
let G=(()=>{try{return JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){return {}}})();G.done=G.done||{};
/* marca de tiempo por clave guardada: decide qué copia es más nueva al sincronizar */
function tsGet(k){try{return JSON.parse(localStorage.getItem(k||"rm_ts"))||{}}catch(e){return {}}}
function touch(k){try{const t=tsGet();t[k]=Date.now();localStorage.setItem("rm_ts",JSON.stringify(t))}catch(e){}}
function gsave(){try{localStorage.setItem(GKEY,JSON.stringify(G));touch(GKEY)}catch(e){}}
/* ================= utilidades ================= */
const $=s=>document.querySelector(s), pn=$("#pn");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cleanEx=t=>String(t||"").replace(/^\s*(Correct[oa]|Incorrect[oa]|Falso|Verdadero)\s*[.:,;—-]\s*/i,"");
const words=s=>String(s||"").split(/\s+/).filter(Boolean);
const clip=(s,n)=>{const w=words(s);return w.length<=n?s:w.slice(0,n).join(" ")+"…"};
/* timers registrados (se limpian al cambiar de pantalla) */
const T={iv:new Set(),to:new Set()};
function every(fn,ms){const id=setInterval(fn,ms);T.iv.add(id);return id}
function later(fn,ms){const id=setTimeout(()=>{T.to.delete(id);fn()},ms);T.to.add(id);return id}
var OVER=null;
function clearAll(){OVER=null;T.iv.forEach(clearInterval);T.to.forEach(clearTimeout);T.iv.clear();T.to.clear()}
/* ================= estado ================= */
/* metadatos del nivel (story.meta): id, título, clave de guardado, textos del jefe */
const META=Object.assign({id:"?",title:"",key:"rm_v3_default",arena:"ARENA DEL JEFE",bossShort:"Jefe",bossChange:"cambia de forma"},STORY.meta||{});
const KEY=META.key;
const CREA={};STORY.creatures.forEach(c=>CREA[c.id]=c);LEVELS.forEach(l=>l.story.creatures.forEach(c=>{if(!CREA[c.id])CREA[c.id]=c}));
const TCHART=Object.assign({},...LEVELS.map(l=>l.story.typeChart||{}),STORY.typeChart);
/* qué criaturas se unen en cada zona: zones[i].join */
const JOIN={};STORY.zones.forEach((z,zi)=>{if(z.join&&z.join.length)JOIN[zi]=z.join});
const DEF={zone:0,x:2,y:4,dir:"right",team:[],box:[],potions:2,flags:{},srs:{},stats:{ok:0,n:0},idle:45,voice:false,nefro:[],shields:[],boss:null,alerts:0,done:false};
function fresh(){const f=JSON.parse(JSON.stringify(DEF));if(G.team&&G.team.length){f.team=G.team;f.box=G.box||[]}return f}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.team)return Object.assign(fresh(),s)}catch(e){}return fresh()})();
/* el equipo es uno solo para todo el juego (la partida de cada nivel guarda solo su avance) */
if(G.team&&G.team.length){S.team=G.team;S.box=G.box||[]}else if(S.team.length){G.team=S.team;G.box=S.box;gsave()}
S.team.forEach(c=>{if(c.hp<1)c.hp=1});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));touch(KEY)}catch(e){}if(S.team.length){G.team=S.team;G.box=S.box;gsave()}}
function mkCrea(id){const c=CREA[id];return{id,lvl:3,xp:0,max:30,hp:30,evo:false}}
function cName(c){return c.evo?CREA[c.id].evoName:CREA[c.id].name}
function active(){return S.team.find(c=>c.hp>0)}
/* ================= repaso espaciado GLOBAL (rm_srs): todas las preguntas de todos los niveles ================= */
/* intervalos que "aterrizan" en el examen: nunca más de 1/3 de los días que faltan (Cepeda 2008) */
const EXAM=new Date(2027,0,16,8).getTime(),DAY=864e5;const daysLeft=()=>{const t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((new Date(2027,0,16)-t)/DAY))};
const TB={};LEVELS.forEach(l=>(l.bank||[]).forEach(q=>{if(q&&q.id&&q.opciones&&!TB[q.id])TB[q.id]=q}));
let GS=(()=>{try{return JSON.parse(localStorage.getItem("rm_srs"))||{}}catch(e){return {}}})();
function gssave(){try{localStorage.setItem("rm_srs",JSON.stringify(GS));touch("rm_srs")}catch(e){}}
/* la primera vez, junta el repaso que cada nivel guardaba por separado */
(()=>{let ch=0;GS._m=GS._m||{};LEVELS.forEach(l=>{const k=l.story.meta.key;if(GS._m[k])return;try{const o=JSON.parse(localStorage.getItem(k));Object.entries((o&&o.srs)||{}).forEach(([id,r])=>{const g=GS[id];if(!g||(r.due||0)>(g.due||0))GS[id]=Object.assign({t:0},r)})}catch(e){}GS._m[k]=1;ch++});if(ch)gssave()})();
const gsIds=()=>Object.keys(GS).filter(id=>id!=="_m");
const hoyF=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
/* meta dinámica: nuevas por día para ver todo el banco antes del 3 de enero (luego solo Torre y repaso) + vencidas; se fija al empezar el día */
const JAN3=new Date(2027,0,3).getTime();
function ritmo(){const un=Object.values(TB).filter(q=>!GS[q.id]).length;const d=Math.max(1,Math.ceil((JAN3-Date.now())/DAY));return{un,d,per:Math.min(70,Math.ceil(un/d))}}
function metaDia(){const D=G.dia;if(D&&D.f===hoyF()&&D.meta)return D.meta;return Math.max(30,Math.min(90,ritmo().per+dueCount()))}
function diaHoy(){const h=hoyF();if(!G.dia||G.dia.f!==h){const m=metaDia(),r=ritmo();G.dia={f:h,n:0,ok:0,nw:0,meta:m,per:r.per}}if(!G.dia.meta)G.dia.meta=metaDia();if(G.dia.per==null)G.dia.per=ritmo().per;return G.dia}
function racha(){return G.rachaF===hoyF()||G.rachaF===hoyF(Date.now()-DAY)?(G.racha||0):0}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
/* ================= preguntas ================= */
const ALL={};
function reg(q,src){if(!q||!q.id)return;q._src=src;ALL[q.id]=q}
const L_=x=>Array.isArray(x)?x:[];
L_(BANK).forEach(q=>reg(q,"banco"));L_(Q1.pasto).forEach(q=>reg(q,"pasto"));L_(Q1.subditos).forEach(q=>reg(q,"puerta"));Object.values(Q1.gates||{}).forEach(q=>reg(q,"puerta"));reg(Q1.apertura,"puerta");L_(Q1.jefeB).forEach(q=>reg(q,"jefe"));
L_(Q2.pasto).forEach(q=>reg(q,"pasto"));L_(Q2.puertas).forEach(q=>reg(q,"puerta"));L_(Q2.entrenadores).forEach(q=>reg(q,"serie"));L_(Q2.jefeC).forEach(q=>reg(q,"jefe"));
const PASTO=Object.values(ALL).filter(q=>q._src==="pasto");
const MCQPOOL=Object.values(ALL).filter(q=>q._src==="puerta");
function series(id){return Object.values(ALL).filter(q=>q.serie_id===id).sort((a,b)=>a.orden-b.orden)}
const STOP=new Set("de la el en y a los las del con por para que un una se su al o es más como sin lo".split(" "));
const toks=s=>new Set(String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)));
/* reservadas: series de entrenadores y preguntas del jefe; el resto del banco del nivel entra a las puertas */
const RESV=new Set(),RESS=new Set();STORY.zones.forEach(z=>z.trainers.forEach(t=>{if(t.serie)RESS.add(t.serie)}));STORY.boss.phases.forEach(P=>{(P.questions||[]).forEach(id=>{RESV.add(id);if(ALL[id]&&ALL[id].serie_id)RESS.add(ALL[id].serie_id)});(P.series||[]).forEach(s=>RESS.add(s))});
const MCQX=MCQPOOL.concat(Object.values(ALL).filter(q=>(q._src==="pasto"&&!q.vf)||(q._src==="banco"&&!RESV.has(q.id)&&!RESS.has(q.serie_id))));
function topicPick(topics,n,used){const T0=toks(topics.join(" "));const sc=MCQX.map(q=>{const t=toks(q.enunciado+" "+(q.tema||"")+" "+(q.subtema||"")+" "+(q.perla||""));let s=0;t.forEach(w=>{if(T0.has(w))s++});return{q,s:s+Math.random()*.5-(used.has(q.id)?3:0)-(GS[q.id]?1.5:0)}}).sort((a,b)=>b.s-a.s);return sc.slice(0,n).map(x=>x.q)}
/* asignación de entrenadores y puertas */
/* serie de cada entrenador: trainers[].serie (si falta, preguntas por tema) */
const SERIE_OF={};STORY.zones.forEach(z=>z.trainers.forEach(t=>{if(t.serie)SERIE_OF[t.id]=t.serie}));
/* rejuego (S.replay): las preguntas del nivel salen del banco completo del mismo subtema, primero las no vistas y las recordadas */
const REPL=(()=>{if(!S.replay)return null;const subs=new Set(BANK.map(q=>q.sub).filter(Boolean)),tem=new Set(BANK.map(q=>q.tema_id));let p=Object.values(TB).filter(q=>subs.has(q.sub));if(p.length<15)p=Object.values(TB).filter(q=>tem.has(q.tema_id));
 const sc=q=>(GS[q.id]?(GS[q.id].t||0)/1e13+10:0)-(isRecall(q)?2:0)+Math.random();const units={};p.forEach(q=>{const k=q.serie_id||q.id;(units[k]=units[k]||[]).push(q)});
 const U=Object.values(units).map(u=>{u.sort((a,b)=>(a.orden||0)-(b.orden||0));return{u,s:Math.min(...u.map(sc))}}).sort((a,b)=>a.s-b.s).map(x=>x.u);U.forEach(u=>u.forEach(q=>reg(q,"banco")));return U})();
const PLAN={};(()=>{const used=new Set();
 STORY.zones.forEach((z,zi)=>{z.trainers.forEach(t=>{let qs=SERIE_OF[t.id]?series(SERIE_OF[t.id]):[];if(!qs.length)qs=topicPick(t.questionTopics||[t.specialty],t.n||3,used);qs.forEach(q=>used.add(q.id));PLAN[t.id]=qs.map(q=>q.id)});
  z.gates.forEach((g,gi)=>{const qs=topicPick([g.topic],3,used);qs.forEach(q=>used.add(q.id));PLAN["g_"+zi+"_"+gi]=qs.map(q=>q.id)})});
 /* preguntas del jefe por fase: boss.phases[i].questions (ids), .series (series completas) y .pick {topics,n} */
 PLAN.boss=STORY.boss.phases.map(P=>{const ids=(P.questions||[]).filter(id=>ALL[id]);(P.series||[]).forEach(s=>series(s).forEach(q=>ids.push(q.id)));
  if(P.pick){const ex=topicPick(P.pick.topics||P.topics||[],P.pick.n||2,used);ex.forEach(q=>used.add(q.id));ids.push(...ex.map(q=>q.id))}
  if(!ids.length)ids.push(...topicPick(P.topics||[P.name],3,used).map(q=>q.id));return ids});
 if(REPL&&REPL.length>=6){const U=REPL.slice(),one=()=>{const k=U.findIndex(u=>u.length===1);return k>=0?U.splice(k,1)[0]:U.shift()};
  PLAN.boss=PLAN.boss.map(()=>{const ids=[];for(let j=0;j<3&&U.length;j++)ids.push(...one().slice(0,1).map(q=>q.id));return ids.length?ids:null}).map((x,i)=>x||PLAN.boss[i]);
  STORY.zones.forEach((z,zi)=>{z.trainers.forEach(t=>{if(U.length)PLAN[t.id]=U.shift().slice(0,5).map(q=>q.id)});z.gates.forEach((g,gi)=>{const ids=[];for(let j=0;j<3&&U.length;j++)ids.push(one()[0].id);if(ids.length)PLAN["g_"+zi+"_"+gi]=ids})})}})();
/* repetición espaciada: cajas 1-2-4-8-15-25 días, con tope de 1/3 de lo que falta para el examen.
   Fallo: baja 2 cajas (las recordadas de examen vuelven a 0). soft = no calificar (somnolencia, tiempo agotado, despertador). */
const BOXD=[1,2,4,8,15,25];let sessQ=[],sessN=0,lastAlert=0;
const isRecall=q=>(q.origen||[]).some(o=>/26$/.test(o));
const ivl=b=>Math.max(1,Math.min(BOXD[b],Math.floor((EXAM-Date.now())/DAY/3)));

/* intercala: nunca dos seguidas del mismo tema (Rohrer 2007) */
function interleave(qs){const by={};qs.forEach(q=>(by[q.tema||"?"]=by[q.tema||"?"]||[]).push(q));const out=[];let last=null;
 while(out.length<qs.length){const ks=Object.keys(by).filter(k=>by[k].length).sort((a,b)=>by[b].length-by[a].length);const k=ks.find(k=>k!==last)||ks[0];out.push(by[k].shift());last=k}return out}

   Destello seguro: solo 2 cuadros, 30 %, y solo sobre el blanco (nunca sobre las cajas de vida). */

const FXBASE={Eferente:"Nefroprotector",NCC:"Diurético",FactorB:"Anti-complemento",NFAT:"Podoprotector",IFNAR:"Anti-citocina",NET:"Fagocito"};
function playFx(kind,type,cb){sfx.power(kind,FXBASE[type]||type);if(!BAT)return cb();BAT.fx={kind,type,t:0,cb}}

/* ================= estadística por tema ================= */
/* límite inferior de Wilson (80 %): el color no se pone verde con 3 aciertos de suerte */
function wilson(k,n,z=1.28){if(!n)return 0;const p=k/n,d=1+z*z/n;return (p+z*z/(2*n)-z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n)))/d}
/* acc: última respuesta de cada pregunta vista · lp: exactitud a largo plazo (respuestas tras ≥4 días; si hay <5, acc) · cov: cobertura ·
   dom = 0.6·lp + 0.4·caja · col: color solo por aciertos (⚪ con <5) · pri = peso × lo que falta · cs/cd: acierto cuando dijo SEGURO/DUDÉ */
function temaStats(){const T={};Object.values(TB).forEach(q=>{const k=q.tema_id;const t=T[k]=T[k]||{id:k,name:q.tema,meta:TEMARIO[k]||10,tot:0,seen:0,ok:0,box:0,lo:0,ln:0};t.tot++;const r=GS[q.id];if(r&&r.t!==undefined){t.seen++;t.ok+=r.last?1:0;t.box+=Math.max(0,r.b);t.lo+=r.lo||0;t.ln+=r.ln||0}});
 const C=G.cal||{};Object.values(T).forEach(t=>{t.acc=t.seen?t.ok/t.seen:0;t.lp=t.ln>=5?t.lo/t.ln:t.acc;t.cov=t.tot?t.seen/t.tot:0;t.wl=wilson(t.ok,t.seen);
  t.dom=t.seen?.6*t.lp+.4*Math.min(1,t.box/t.seen/3):0;t.col=t.seen<5?"⚪":t.wl>=.7?"🟢":t.wl>=.5?"🟡":"🔴";t.pri=t.meta*(1-t.dom*Math.sqrt(t.cov));const c=C[t.id]||{};t.cs=c.s||[0,0];t.cd=c.d||[0,0]});return T}
/* pronóstico del examen: Σ peso × (cobertura·exactitud + no vistas·0.35), ±1 error estándar (muestra propia + 300 preguntas del examen) */
function pronostico(){const T=Object.values(temaStats());const W=T.reduce((a,t)=>a+t.meta,0)||1;let P=0,V=0,n=0;T.forEach(t=>{const w=t.meta/W,p=t.cov*t.lp+(1-t.cov)*.35;P+=w*p;V+=w*w*(t.seen?t.lp*(1-t.lp)/t.seen:.06)*(t.cov||1);n+=t.seen});const se=Math.sqrt(V+P*(1-P)/300);return{p:P,lo:Math.max(0,P-se),hi:Math.min(1,P+se),n}}
const PCT=x=>Math.round(100*x);
function fcastTxt(){const F=pronostico();if(F.n<30)return'📈 Pronóstico del examen: responde '+(30-F.n)+' más para calcularlo.';const fl=(tLoad().hist||[]).filter(h=>h[2]!=="rev").slice(-4).map(h=>h[1]+"%");

/* ================= lista con reaprendizaje en la misma sesión ================= */
/* el fallo (y el error confiado) vuelve 3–5 preguntas después, sin calificar, hasta acertarla (máx. 3 veces; Rawson y Dunlosky 2011) */
function runList(qs,labelOf,onEnd,o={}){let i=0,ok=0,first=0;const re=new Map(),res=[];
 const step=()=>{if(i>=qs.length){duck(0);return onEnd({ok,n:first,res})}const q=qs[i];const e=re.get(q.id),again=!!(e&&e.pend);
  renderQ(q,labelOf(q,first,qs,again),0,(r,c)=>{const E=re.get(q.id)||{k:0,pend:false};if(!again){first++;if(r)ok++;res.push([q,r,c])}
   if(!r&&E.k<3){E.k++;E.pend=true;qs.splice(Math.min(qs.length,i+4+(Math.random()*3|0)),0,q)}else E.pend=false;re.set(q.id,E);i++;step()},{glob:!ALL[q.id],soft:again,gen:o.gen})};step()}

/* ================= GUARDIA DE HOY: 20 preguntas del banco completo, sin caminar ================= */
/* orden: vencidas (intercaladas) → cuota de nuevas del día (recordadas de examen y alto peso primero) → series nuevas de los temas con más prioridad.
   Con alerta baja: solo vencidas (o errores de hoy), sin nuevas. */
function guardiaList(n=20,temas){const out=[],have=new Set();const add=q=>{if(q&&!have.has(q.id)&&out.length<n){have.add(q.id);out.push(q)}};const addS=q=>(q.serie_id?tSeries(q.serie_id):[q]).forEach(add);

  Object.values(TB).filter(q=>isRecall(q)&&fresh(q)).map(q=>[q,(q.peso||0)+Math.random()*30]).sort((a,b)=>b[1]-a[1]).forEach(([q])=>{if(out.length<cap&&fresh(q))addS(q)})}
 const T=temaStats();const ks=temas||Object.values(T).sort((a,b)=>b.pri-a.pri).slice(0,6).map(t=>t.id);let guard=0;
 while(out.length<n&&guard++<200){const k=ks[guard%ks.length];const c=Object.values(TB).filter(q=>q.tema_id==k&&fresh(q)).map(q=>[q,(isRecall(q)?40:0)+(q.peso||0)*.3+Math.random()*30]).sort((a,b)=>b[1]-a[1]);
  if(c.length)addS(c[0][0]);else{const any=shuf(Object.values(TB).filter(q=>q.tema_id==k&&!have.has(q.id)&&(!q.serie_id||q.orden===1)));if(any.length)addS(any[0])}}
 return out}
