<script id="eng">
"use strict";
const SRC_HTML="<!DOCTYPE html>"+document.documentElement.outerHTML;
const LEVELS=__LEVELS__, REGIONS=__REGIONS__, TEMARIO=__TEMARIO__;
/* nivel en curso: el que eligió el mapa (rm_cur) o el primero del archivo */
const CUR=(()=>{try{return localStorage.getItem("rm_cur")}catch(e){return null}})();
const LV=LEVELS.find(l=>l.story.meta.id===CUR)||LEVELS[0];
const STORY=LV.story,Q1=LV.q1||{},Q2=LV.q2||{},BANK=LV.bank||[];
/* progreso global entre niveles: equipo, caja y niveles superados */
const GKEY="rm_global";
let G=(()=>{try{return JSON.parse(localStorage.getItem(GKEY))||{}}catch(e){return {}}})();G.done=G.done||{};
/* marca de tiempo por clave guardada: decide qué copia es más nueva al sincronizar */
function tsGet(k){try{return JSON.parse(localStorage.getItem(k||"rm_ts"))||{}}catch(e){return {}}}
function touch(k){try{const t=tsGet();t[k]=Date.now();localStorage.setItem("rm_ts",JSON.stringify(t))}catch(e){}}
function gsave(){try{localStorage.setItem(GKEY,JSON.stringify(G));touch(GKEY)}catch(e){}}
/* ================= utilidades ================= */
const $=s=>document.querySelector(s), pn=$("#pn");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const words=s=>String(s||"").split(/\s+/).filter(Boolean);
const clip=(s,n)=>{const w=words(s);return w.length<=n?s:w.slice(0,n).join(" ")+"…"};
/* timers registrados (se limpian al cambiar de pantalla) */
const T={iv:new Set(),to:new Set()};
function every(fn,ms){const id=setInterval(fn,ms);T.iv.add(id);return id}
function later(fn,ms){const id=setTimeout(()=>{T.to.delete(id);fn()},ms);T.to.add(id);return id}
var OVER=null;
function clearAll(){OVER=null;T.iv.forEach(clearInterval);T.to.forEach(clearTimeout);T.iv.clear();T.to.clear()}
/* ================= estado ================= */
/* metadatos del nivel (story.meta): id, título, clave de guardado, textos del jefe */
const META=Object.assign({id:"?",title:"",key:"rm_v3_default",arena:"ARENA DEL JEFE",bossShort:"Jefe",bossChange:"cambia de forma"},STORY.meta||{});
const KEY=META.key;
const CREA={};STORY.creatures.forEach(c=>CREA[c.id]=c);LEVELS.forEach(l=>l.story.creatures.forEach(c=>{if(!CREA[c.id])CREA[c.id]=c}));
const TCHART=Object.assign({},...LEVELS.map(l=>l.story.typeChart||{}),STORY.typeChart);
/* qué criaturas se unen en cada zona: zones[i].join */
const JOIN={};STORY.zones.forEach((z,zi)=>{if(z.join&&z.join.length)JOIN[zi]=z.join});
const DEF={zone:0,x:2,y:4,dir:"right",team:[],box:[],potions:2,flags:{},srs:{},stats:{ok:0,n:0},idle:45,voice:false,nefro:[],shields:[],boss:null,alerts:0,done:false};
function fresh(){const f=JSON.parse(JSON.stringify(DEF));if(G.team&&G.team.length){f.team=G.team;f.box=G.box||[]}return f}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.team)return Object.assign(fresh(),s)}catch(e){}return fresh()})();
/* el equipo es uno solo para todo el juego (la partida de cada nivel guarda solo su avance) */
if(G.team&&G.team.length){S.team=G.team;S.box=G.box||[]}else if(S.team.length){G.team=S.team;G.box=S.box;gsave()}
S.team.forEach(c=>{if(c.hp<1)c.hp=1});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));touch(KEY)}catch(e){}if(S.team.length){G.team=S.team;G.box=S.box;gsave()}}
function mkCrea(id){const c=CREA[id];return{id,lvl:3,xp:0,max:30,hp:30,evo:false}}
function cName(c){return c.evo?CREA[c.id].evoName:CREA[c.id].name}
function active(){return S.team.find(c=>c.hp>0)}
/* ================= repaso espaciado GLOBAL (rm_srs): todas las preguntas de todos los niveles ================= */
/* intervalos que "aterrizan" en el examen: nunca más de 1/3 de los días que faltan (Cepeda 2008) */
const EXAM=new Date(2027,0,16,8).getTime(),DAY=864e5;const daysLeft=()=>{const t=new Date();t.setHours(0,0,0,0);return Math.max(0,Math.round((new Date(2027,0,16)-t)/DAY))};
const TB={};LEVELS.forEach(l=>(l.bank||[]).forEach(q=>{if(q&&q.id&&q.opciones&&!TB[q.id])TB[q.id]=q}));
let GS=(()=>{try{return JSON.parse(localStorage.getItem("rm_srs"))||{}}catch(e){return {}}})();
function gssave(){try{localStorage.setItem("rm_srs",JSON.stringify(GS));touch("rm_srs")}catch(e){}}
/* la primera vez, junta el repaso que cada nivel guardaba por separado */
(()=>{let ch=0;GS._m=GS._m||{};LEVELS.forEach(l=>{const k=l.story.meta.key;if(GS._m[k])return;try{const o=JSON.parse(localStorage.getItem(k));Object.entries((o&&o.srs)||{}).forEach(([id,r])=>{const g=GS[id];if(!g||(r.due||0)>(g.due||0))GS[id]=Object.assign({t:0},r)})}catch(e){}GS._m[k]=1;ch++});if(ch)gssave()})();
const gsIds=()=>Object.keys(GS).filter(id=>id!=="_m");
const hoyF=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const META_DIA=60;
function racha(){return G.rachaF===hoyF()||G.rachaF===hoyF(Date.now()-DAY)?(G.racha||0):0}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
/* ================= preguntas ================= */
const ALL={};
function reg(q,src){if(!q||!q.id)return;q._src=src;ALL[q.id]=q}
const L_=x=>Array.isArray(x)?x:[];
L_(BANK).forEach(q=>reg(q,"banco"));L_(Q1.pasto).forEach(q=>reg(q,"pasto"));L_(Q1.subditos).forEach(q=>reg(q,"puerta"));Object.values(Q1.gates||{}).forEach(q=>reg(q,"puerta"));reg(Q1.apertura,"puerta");L_(Q1.jefeB).forEach(q=>reg(q,"jefe"));
L_(Q2.pasto).forEach(q=>reg(q,"pasto"));L_(Q2.puertas).forEach(q=>reg(q,"puerta"));L_(Q2.entrenadores).forEach(q=>reg(q,"serie"));L_(Q2.jefeC).forEach(q=>reg(q,"jefe"));
const PASTO=Object.values(ALL).filter(q=>q._src==="pasto");
const MCQPOOL=Object.values(ALL).filter(q=>q._src==="puerta");
function series(id){return Object.values(ALL).filter(q=>q.serie_id===id).sort((a,b)=>a.orden-b.orden)}
const STOP=new Set("de la el en y a los las del con por para que un una se su al o es más como sin lo".split(" "));
const toks=s=>new Set(String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)));
/* reservadas: series de entrenadores y preguntas del jefe; el resto del banco del nivel entra a las puertas */
const RESV=new Set(),RESS=new Set();STORY.zones.forEach(z=>z.trainers.forEach(t=>{if(t.serie)RESS.add(t.serie)}));STORY.boss.phases.forEach(P=>{(P.questions||[]).forEach(id=>{RESV.add(id);if(ALL[id]&&ALL[id].serie_id)RESS.add(ALL[id].serie_id)});(P.series||[]).forEach(s=>RESS.add(s))});
const MCQX=MCQPOOL.concat(Object.values(ALL).filter(q=>(q._src==="pasto"&&!q.vf)||(q._src==="banco"&&!RESV.has(q.id)&&!RESS.has(q.serie_id))));
function topicPick(topics,n,used){const T0=toks(topics.join(" "));const sc=MCQX.map(q=>{const t=toks(q.enunciado+" "+(q.tema||"")+" "+(q.subtema||"")+" "+(q.perla||""));let s=0;t.forEach(w=>{if(T0.has(w))s++});return{q,s:s+Math.random()*.5-(used.has(q.id)?3:0)-(GS[q.id]?1.5:0)}}).sort((a,b)=>b.s-a.s);return sc.slice(0,n).map(x=>x.q)}
/* asignación de entrenadores y puertas */
/* serie de cada entrenador: trainers[].serie (si falta, preguntas por tema) */
const SERIE_OF={};STORY.zones.forEach(z=>z.trainers.forEach(t=>{if(t.serie)SERIE_OF[t.id]=t.serie}));
const PLAN={};(()=>{const used=new Set();
 STORY.zones.forEach((z,zi)=>{z.trainers.forEach(t=>{let qs=SERIE_OF[t.id]?series(SERIE_OF[t.id]):[];if(!qs.length)qs=topicPick(t.questionTopics||[t.specialty],t.n||3,used);qs.forEach(q=>used.add(q.id));PLAN[t.id]=qs.map(q=>q.id)});
  z.gates.forEach((g,gi)=>{const qs=topicPick([g.topic],3,used);qs.forEach(q=>used.add(q.id));PLAN["g_"+zi+"_"+gi]=qs.map(q=>q.id)})});
 /* preguntas del jefe por fase: boss.phases[i].questions (ids), .series (series completas) y .pick {topics,n} */
 PLAN.boss=STORY.boss.phases.map(P=>{const ids=(P.questions||[]).filter(id=>ALL[id]);(P.series||[]).forEach(s=>series(s).forEach(q=>ids.push(q.id)));
  if(P.pick){const ex=topicPick(P.pick.topics||P.topics||[],P.pick.n||2,used);ex.forEach(q=>used.add(q.id));ids.push(...ex.map(q=>q.id))}
  if(!ids.length)ids.push(...topicPick(P.topics||[P.name],3,used).map(q=>q.id));return ids})})();
/* repetición espaciada: cajas 1-2-4-8-15-25 días, con tope de 1/3 de lo que falta para el examen.
   Fallo: baja 2 cajas (las recordadas de examen vuelven a 0). soft = no calificar (somnolencia, tiempo agotado, despertador). */
const BOXD=[1,2,4,8,15,25];let sessQ=[],sessN=0,lastAlert=0;
const isRecall=q=>(q.origen||[]).some(o=>/26$/.test(o));
const ivl=b=>Math.max(1,Math.min(BOXD[b],Math.floor((EXAM-Date.now())/DAY/3)));
function grade(q,ok,o={}){const now=Date.now();
 if(o.soft||now-lastAlert<60000){if(!ok)sessQ.push({id:q.id,at:sessN+3+(Math.random()*3|0)});sessN++;return}
 (o.glob?[GS]:[S.srs,GS]).forEach(st=>{const r=st[q.id]||{b:-1,due:0};const wasDue=r.b<0||r.due<=now;
  if(ok){if(wasDue){r.b=Math.min(r.b+1,BOXD.length-1);r.due=now+ivl(r.b)*DAY}}
  else{r.b=r.b<0||isRecall(q)?0:Math.max(0,r.b-2);r.due=now+DAY}
  r.last=ok?1:0;r.t=now;st[q.id]=r});
 if(!ok)sessQ.push({id:q.id,at:sessN+3+(Math.random()*3|0)});
 if(!o.glob){S.stats.n++;if(ok)S.stats.ok++}sessN++;
 const h=hoyF();if(!G.dia||G.dia.f!==h)G.dia={f:h,n:0,ok:0};G.dia.n++;if(ok)G.dia.ok++;
 if(G.dia.n===META_DIA&&G.rachaF!==h){G.racha=racha()+1;G.rachaF=h;sfx.lvl();toast("🔥 ¡Meta del día! Racha de "+G.racha+" día"+(G.racha>1?"s":""))}
 save();gssave();hud()}
const pick=a=>a[Math.random()*a.length|0];
const QG=id=>ALL[id]||TB[id];
function nextPasto(){const now=Date.now();const i=sessQ.findIndex(s=>s.at<=sessN);if(i>=0){const id=sessQ.splice(i,1)[0].id;if(ALL[id])return ALL[id]}
 /* 1) vencidas del nivel (también opción múltiple) · 2) V/F nuevas · 3) opción múltiple nunca vista del banco del nivel */
 const due=Object.values(ALL).filter(q=>GS[q.id]&&GS[q.id].due<=now);if(due.length&&Math.random()<.7)return pick(due);
 const fv=PASTO.filter(q=>!GS[q.id]),fm=MCQX.filter(q=>!GS[q.id]&&!q.vf&&(!q.serie_id||q.orden===1));
 if(fv.length&&(!fm.length||Math.random()<.4))return pick(fv);if(fm.length)return pick(fm);if(due.length)return pick(due);return pick(PASTO)}
/* vencidas en TODO el juego (las que existen en este archivo) */
function dueList(){const now=Date.now();return gsIds().filter(id=>GS[id].due<=now&&QG(id)).sort((a,b)=>GS[a].due-GS[b].due)}
function dueCount(){return dueList().length}
/* intercala: nunca dos seguidas del mismo tema (Rohrer 2007) */
function interleave(qs){const by={};qs.forEach(q=>(by[q.tema||"?"]=by[q.tema||"?"]||[]).push(q));const out=[];let last=null;
 while(out.length<qs.length){const ks=Object.keys(by).filter(k=>by[k].length).sort((a,b)=>by[b].length-by[a].length);const k=ks.find(k=>k!==last)||ks[0];out.push(by[k].shift());last=k}return out}
/* ================= audio: música chiptune y efectos (Web Audio, sin archivos: funciona sin conexión) ================= */
/* SND: 2 = música y efectos · 1 = solo efectos · 0 = silencio. La alarma de inactividad suena siempre (regla 4). */
let AC=null,MG=null,FG=null,NZ=null,SND=2;try{const v=localStorage.getItem("rm_snd");if(v!=null)SND=+v}catch(e){}
function unlockAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();FG=AC.createGain();MG.connect(AC.destination);FG.connect(AC.destination);
  NZ=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const d=NZ.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;sndApply();setInterval(musTick,40)}
  if(AC.state==="suspended"&&!document.hidden)AC.resume()}catch(e){}

function temaStats(){const T={};Object.values(TB).forEach(q=>{const k=q.tema_id;const t=T[k]=T[k]||{id:k,name:q.tema,meta:TEMARIO[k]||10,tot:0,seen:0,ok:0,box:0};t.tot++;const r=GS[q.id];if(r&&r.t!==undefined){t.seen++;t.ok+=r.last?1:0;t.box+=Math.max(0,r.b)}});
 Object.values(T).forEach(t=>{t.acc=t.seen?t.ok/t.seen:0;t.dom=t.seen?(t.acc*.6+Math.min(1,t.box/t.seen/3)*.4)*Math.min(1,t.seen/Math.max(8,t.tot*.3)):0;t.pri=t.meta*(1-t.dom)});return T}
function guardiaList(n=20,temas){const out=[],have=new Set();const add=q=>{if(q&&!have.has(q.id)&&out.length<n){have.add(q.id);out.push(q)}};
 if(!temas){const d=dueList().map(QG).filter(q=>q&&!q.vf);interleave(d.slice(0,30)).slice(0,12).forEach(add);
  shuf(Object.values(TB).filter(q=>isRecall(q)&&!GS[q.id]&&(!q.serie_id||q.orden===1))).slice(0,3).forEach(q=>(q.serie_id?tSeries(q.serie_id):[q]).forEach(add))}
 const T=temaStats();const ks=temas||Object.values(T).sort((a,b)=>b.pri-a.pri).slice(0,6).map(t=>t.id);let guard=0;
 while(out.length<n&&guard++<200){const k=ks[guard%ks.length];const c=shuf(Object.values(TB).filter(q=>q.tema_id==k&&!GS[q.id]&&!have.has(q.id)&&(!q.serie_id||q.orden===1)));
  if(c.length)(c[0].serie_id?tSeries(c[0].serie_id):[c[0]]).forEach(add);else{const any=shuf(Object.values(TB).filter(q=>q.tema_id==k&&!have.has(q.id)&&(!q.serie_id||q.orden===1)));if(any.length)(any[0].serie_id?tSeries(any[0].serie_id):[any[0]]).forEach(add)}}
 return out}

const TKEY="rm_torre";
function tSeries(id){return Object.values(TB).filter(q=>q.serie_id===id).sort((a,b)=>a.orden-b.orden)}
function tLoad(){try{return JSON.parse(localStorage.getItem(TKEY))||{}}catch(e){return {}}}

/* muestra ponderada por el peso de cada tema en el temario; los casos seriados van completos y en orden */
function torreBuild(n){const by={},seen=new Set();Object.values(TB).sort((a,b)=>a.orden-b.orden).forEach(q=>{if(seen.has(q.serie_id))return;seen.add(q.serie_id);(by[q.tema_id]=by[q.tema_id]||new Set()).add(q.serie_id)});
 const tot=Object.keys(by).reduce((a,k)=>a+(TEMARIO[k]||10),0);const out=[];let left=[];
 Object.keys(by).forEach(k=>{let quota=Math.round(n*(TEMARIO[k]||10)/tot),c=0;shuf([...by[k]]).forEach(s=>{const qs=tSeries(s);if(c<quota){out.push(qs);c+=qs.length}else left.push(qs)})});
 let flat=shuf(out);let cnt=flat.reduce((a,s)=>a+s.length,0);left=shuf(left);
 while(cnt<n&&left.length){const s=left.pop();flat.push(s);cnt+=s.length}
 flat=shuf(flat);const ids=[];for(const s of flat){for(const q of s){if(ids.length<n)ids.push(q.id)}}return ids}

 Object.entries(tLoad().fails||{}).forEach(([id,v])=>{if(v&&TB[id])ids.add(id)});return [...ids]}

  let h='<div class="who">🏛 '+esc(R.label)+' · '+(R.i+1)+'/'+R.ids.length+(R.left!=null?' · ⏱ <span id="tclk">'+fmtClock(R.left)+'</span>':'')+'</div>';
  if(ctx.length){const last=ctx[ctx.length-1],prev=ctx.slice(0,-1);h+='<div class="box case">'+(prev.length?'<details><summary class="small">▸ Caso previo</summary><span class="small">'+prev.map(esc).join("<br>")+'</span></details>':'')+esc(last)+'</div>'}
  h+='<div class="q" data-id="'+esc(q.id)+'" data-torre="1">'+esc(q.enunciado)+'</div>'+L.map(k=>'<button class="opt" data-l="'+k+'"><b>'+k+'</b>'+esc(q.opciones[k])+'</button>').join("")+'<div class="row"><button class="btn alt" id="tq">GUARDAR Y SALIR</button></div>';
  pn.innerHTML=h;pn.scrollTop=0;const btns=[...pn.querySelectorAll(".opt")];let sel=-1;KEYA=()=>{if(sel>=0)btns[sel].click()};KEYNAV=d=>{sel=(sel+(d==="down"||d==="right"?1:-1)+btns.length)%btns.length;btns.forEach((b,i)=>b.classList.toggle("sel",i===sel))};
  $("#tq").onclick=()=>{KEYNAV=null;sv();clearAll();torre(back)};
  btns.forEach(b=>b.onclick=()=>{const l=b.dataset.l;R.ans[q.id]=l;R.i++;KEYNAV=null;sv();grade(q,l===q.clave,{glob:1});if(!R.fb)return show();const ok=l===q.clave;ok?sfx.ok():sfx.bad();
   btns.forEach(x=>{x.disabled=true;if(x.dataset.l===q.clave)x.classList.add("ok");else if(x.dataset.l===l)x.classList.add("bad")});const ex=q.explicaciones||{};
   pn.insertAdjacentHTML("beforeend",'<div class="box"><b>'+(ok?"¡Correcto!":"Incorrecto. Es la "+q.clave+".")+'</b> '+esc(clip(ex[q.clave]||"",ok?40:22))+'</div>'+(!ok&&ex[l]?'<div class="box small bad2"><b>Tu opción ('+l+'):</b> '+esc(clip(ex[l],15))+'</div>':'')+(q.perla?'<details class="box small"><summary>▸ Ver más</summary><b>Perla:</b> '+esc(q.perla)+(ok||!ex[l]?'':'<br><b>Tu opción:</b> '+esc(ex[l]))+'</details>':'')+'<div class="row"><button class="btn" id="cont">A · CONTINUAR ▶</button></div>');
   const c=$("#cont");KEYA=()=>c.click();c.onclick=show;c.scrollIntoView&&c.scrollIntoView({block:"nearest"})})};
 show()}
function fmtClock(s){s=Math.max(0,s|0);const h=(s/3600)|0,m=((s%3600)/60)|0,x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")}
/* ================= Partida: exportar, importar, sincronizar entre dispositivos y descargar ================= */
const SKEYS=["rm_global","rm_torre","rm_cur","rm_srs",...LEVELS.map(l=>l.story.meta.key)];
function exportar(){const d={},ts=tsGet();SKEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)d[k]={v,t:ts[k]||1}});return JSON.stringify({juego:"residente-miniatura",v:1,fecha:new Date().toISOString(),d})}
/* importa solo lo que sea más nuevo que lo local (o todo, si forzar); devuelve cuántas claves cambió */
/* ¿Qué copia tiene más avance? Se compara el avance real (no solo la hora): preguntas respondidas, zona, jefe y nivel superado.
   Así abrir el juego en otro dispositivo no hace que su copia casi vacía "gane" por ser más reciente. */
function avance(k,v){try{const o=JSON.parse(v);if(k==="rm_global")return Object.keys(o.done||{}).length*1e6+(o.team||[]).reduce((a,c)=>a+(c.lvl||0)*100+(c.xp||0)/100,0);
  if(k==="rm_torre")return Object.keys(o.floors||{}).length*1e5+(o.best||0)*100+Object.keys((o.run&&o.run.ans)||{}).length;
  if(k==="rm_cur")return 0;if(k==="rm_srs")return Object.keys(o).length;const st=o.stats||{};return (o.done?1e9:0)+(o.boss?1e8-((o.boss.hp||100)*1e5):0)+(o.zone||0)*1e6+(st.n||0)*10+Object.keys(o.flags||{}).length}catch(e){return 0}}
/* une la partida global: niveles superados de ambas copias y el equipo más avanzado */
function unirGlobal(a,b){try{const A=JSON.parse(a),B=JSON.parse(b);const best=avance("rm_global",a)>=avance("rm_global",b)?A:B;best.done=Object.assign({},B.done||{},A.done||{});return JSON.stringify(best)}catch(e){return b}}
/* une el repaso global: por pregunta gana la respuesta más reciente */
function unirSrs(a,b){try{const A=JSON.parse(a),B=JSON.parse(b);Object.entries(B).forEach(([id,r])=>{if(id==="_m"){A._m=Object.assign({},r,A._m);return}if(!A[id]||(r.t||0)>(A[id].t||0))A[id]=r});return JSON.stringify(A)}catch(e){return b}}
/* devuelve cuántas partes cambió; forzar = reemplazar todo con lo importado */
function importar(txt,forzar){const o=JSON.parse(txt);if(!o||o.juego!=="residente-miniatura"||!o.d)throw new Error("formato");const ts=tsGet();let n=0;
 Object.entries(o.d).forEach(([k,x])=>{if(!SKEYS.includes(k)||!x||typeof x.v!=="string")return;const loc=localStorage.getItem(k);let nv=null;
  if(forzar||loc==null)nv=x.v;
  else if(k==="rm_global"){const u=unirGlobal(loc,x.v);if(u!==loc)nv=u}
  else if(k==="rm_srs"){const u=unirSrs(loc,x.v);if(u!==loc)nv=u}
  else if(k==="rm_cur"){if((x.t||0)>(ts[k]||0))nv=x.v}
  else{const a=avance(k,x.v),b=avance(k,loc);if(a>b||(a===b&&(x.t||0)>(ts[k]||0)))nv=x.v}
  if(nv!=null&&nv!==loc){localStorage.setItem(k,nv);ts[k]=Date.now();n++}});localStorage.setItem("rm_ts",JSON.stringify(ts));return n}
const SYNC={db:null,col:null,state:"local",busy:false,msg:"Solo en este dispositivo"};
function cloud(s,msg){SYNC.state=s;SYNC.msg=msg;const e=$("#cloud");if(e)e.textContent={ok:"☁✓",up:"☁↑",off:"☁✗",local:""}[s]||"";const m=$("#syncmsg");if(m)m.textContent=msg}
const withT=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("tiempo")),ms))]);
/* sube lo que cambió desde la última subida; sin conexión no hace nada y lo reintenta después */
async function syncPush(){if(!SYNC.col||SYNC.busy)return;SYNC.busy=true;try{const ts=tsGet(),up=tsGet("rm_pushed");const pend=SKEYS.filter(k=>(ts[k]||0)>(up[k]||0)&&localStorage.getItem(k)!=null);
  if(pend.length){cloud("up","Subiendo "+pend.length+"…");for(const k of pend){await withT(SYNC.col.doc(k).set({v:localStorage.getItem(k),t:ts[k]}),10000);up[k]=ts[k];localStorage.setItem("rm_pushed",JSON.stringify(up))}}
  cloud("ok","Sincronizado "+new Date().toLocaleTimeString().slice(0,5))}catch(e){cloud("off","Sin conexión: se guarda aquí y se sube al reconectar")}SYNC.busy=false}
/* baja lo que otro dispositivo guardó después; en la pantalla de inicio se aplica solo, a media partida pregunta */
async function syncPull(){const snap=await withT(SYNC.col.get(),10000);const ts=tsGet(),up=tsGet("rm_pushed"),nuevos={};
 snap.docs.forEach(d=>{const x=d.data()||{},k=d.id;if(!SKEYS.includes(k)||typeof x.v!=="string"||(x.t||0)<=(ts[k]||0))return;const loc=localStorage.getItem(k);if(loc!=null&&k!=="rm_cur"&&k!=="rm_global"&&k!=="rm_srs"&&avance(k,x.v)<avance(k,loc))return;if(k==="rm_global"&&loc!=null)x.v=unirGlobal(loc,x.v);if(k==="rm_srs"&&loc!=null)x.v=unirSrs(loc,x.v);nuevos[k]=x});const ks=Object.keys(nuevos);if(!ks.length)return 0;
 const aplicar=()=>{ks.forEach(k=>{localStorage.setItem(k,nuevos[k].v);ts[k]=nuevos[k].t;up[k]=nuevos[k].t});localStorage.setItem("rm_ts",JSON.stringify(ts));localStorage.setItem("rm_pushed",JSON.stringify(up));location.reload()};
 if(MODE==="title")aplicar();else modal("Hay avance más reciente guardado desde otro dispositivo ("+ks.length+" partes). ¿Cargarlo ahora? Si sigues jugando aquí sin cargarlo, este dispositivo lo reemplazará.",aplicar,"CARGAR");return ks.length}
async function syncInit(){try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;const uid=await user.id();if(!uid)return;
  SYNC.db=db;SYNC.col=db.collection("data/users/"+uid);cloud("up","Conectando…");try{await syncPull()}catch(e){cloud("off","Sin conexión: se guarda aquí y se sube al reconectar")}
  await syncPush();setInterval(syncPush,30000);addEventListener("online",()=>syncPush());document.addEventListener("visibilitychange",()=>{if(document.hidden)syncPush()})}catch(e){}}
function gameFile(){const T="scr"+"ipt";/* quita cualquier otro programa que el visor haya inyectado; deja solo el motor */
 return SRC_HTML.replace(new RegExp("<"+T+"(?![^>]*id=\"eng\")[^>]*>[\\s\\S]*?</"+T+">","g"),"")}
async function bajar(filename,data,type){try{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename,data});return true}}catch(e){if(e&&e.code==="declined")return false}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}}
function partida(back){MODE="title";clearAll();const nlv=Object.keys(G.done).length;
 pn.innerHTML='<div class="who">💾 PARTIDA</div><div class="box small">Niveles superados: '+nlv+'/'+LEVELS.length+'. Tu avance vive en este dispositivo.<br><b>Nube:</b> <span id="syncmsg">'+esc(SYNC.msg)+'</span></div>'+
  (SYNC.col?'<div class="row"><button class="btn" id="p0">☁ SINCRONIZAR AHORA</button></div>':'')+
  '<div class="who">PASAR A OTRO DISPOSITIVO SIN NUBE</div><div class="row"><button class="btn alt" id="p1">COPIAR CÓDIGO</button><button class="btn alt" id="p2">GUARDAR ARCHIVO</button></div><textarea id="pio" spellcheck="false" placeholder="Pega aquí el código de tu otra partida" style="width:100%;height:70px;font:12px monospace;margin-top:6px"></textarea><div class="row"><button class="btn alt" id="p3">IMPORTAR LO MÁS NUEVO</button></div>'+
  '<div class="who" style="margin-top:6px">JUGAR SIN CONEXIÓN</div><div class="small">Descarga el juego en un archivo y ábrelo con tu navegador. Ahí no hay nube: usa el código para traer y llevar tu avance.</div><div class="row"><button class="btn alt" id="p4">⬇ DESCARGAR JUEGO</button><button class="btn" id="bk">ATRÁS</button></div><div class="small" id="pmsg"></div>';
 const msg=m=>{$("#pmsg").textContent=m},io=$("#pio");
 if($("#p0"))$("#p0").onclick=async()=>{try{await syncPull()}catch(e){}await syncPush()};
 $("#p1").onclick=()=>{G.bk=Date.now();gsave();io.value=exportar();try{navigator.clipboard.writeText(io.value).then(()=>msg("Código copiado. Pégalo en PARTIDA del otro dispositivo."),()=>{io.select();msg("Selecciona y copia el texto.")})}catch(e){io.select();msg("Selecciona y copia el texto.")}};
 $("#p2").onclick=async()=>{G.bk=Date.now();gsave();msg(await bajar("residente-partida.json",exportar(),"application/json")?"Archivo de partida listo.":"No se guardó.")};
 $("#p3").onclick=()=>{let n;try{n=importar(io.value.trim())}catch(e){return msg("El texto no es un código de partida válido. Revisa que lo pegaste completo.")}
  if(n){msg("Importado. Recargando…");return later(()=>location.reload(),600)}
  msg("Este dispositivo ya tiene igual o más avance que el código.");if(!$("#p5"))$("#p3").insertAdjacentHTML("afterend",'<button class="btn red" id="p5">REEMPLAZAR TODO CON EL CÓDIGO</button>');
  $("#p5").onclick=()=>modal("Se borrará el avance de este dispositivo y quedará exactamente el del código. ¿Seguro?",()=>{try{importar(io.value.trim(),true);msg("Reemplazado. Recargando…");later(()=>location.reload(),600)}catch(e){msg("El texto no es un código de partida válido.")}},"SÍ, REEMPLAZAR")};
 $("#p4").onclick=async()=>{msg(await bajar("residente-miniatura.html",gameFile(),"text/html")?"Juego descargado. Ábrelo desde tus archivos con el navegador.":"No se descargó.")};
 $("#bk").onclick=back;KEYA=null}
syncInit();
/* app instalable (solo en la versión alojada con manifest): caché para jugar sin conexión y almacenamiento persistente */
if(document.querySelector('link[rel=manifest]')&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
window.__G={exportar,importar,gameFile,SYNC,syncPush,TB,torreBuild,LEVELS,get S(){return S},get MODE(){return MODE},get MAP(){return MAP},get BAT(){return BAT},get RIV(){return RIV},ALL,STORY,PLAN,KEY};
title();requestAnimationFrame(loop);
</script>
