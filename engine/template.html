const CUR=(()=>{try{return localStorage.getItem("rm_cur")}catch(e){return null}})();

const T={iv:new Set(),to:new Set()};

const JOIN={};STORY.zones.forEach((z,zi)=>{if(z.join&&z.join.length)JOIN[zi]=z.join});
const DEF={zone:0,x:2,y:4,dir:"right",team:[],box:[],potions:2,flags:{},srs:{},stats:{ok:0,n:0},idle:45,voice:false,nefro:[],shields:[],boss:null,alerts:0,done:false};
function fresh(){const f=JSON.parse(JSON.stringify(DEF));if(G.team&&G.team.length){f.team=G.team;f.box=G.box||[]}return f}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.team)return Object.assign(fresh(),s)}catch(e){}return fresh()})();
/* el equipo es uno solo para todo el juego (la partida de cada nivel guarda solo su avance) */
if(G.team&&G.team.length){S.team=G.team;S.box=G.box||[]}else if(S.team.length){G.team=S.team;G.box=S.box;gsave()}
S.team.forEach(c=>{if(c.hp<1)c.hp=1});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));touch(KEY)}catch(e){}if(S.team.length){G.team=S.team;G.box=S.box;gsave()}}
function mkCrea(id){const c=CREA[id];return{id,lvl:3,xp:0,max:30,hp:30,evo:false}}
function cName(c){return c.evo?CREA[c.id].evoName:CREA[c.id].name}
function active(){return S.team.find(c=>c.hp>0)}
/* ================= preguntas ================= */
const ALL={};
function reg(q,src){if(!q||!q.id)return;q._src=src;ALL[q.id]=q}
const L_=x=>Array.isArray(x)?x:[];
L_(BANK).forEach(q=>reg(q,"banco"));L_(Q1.pasto).forEach(q=>reg(q,"pasto"));L_(Q1.subditos).forEach(q=>reg(q,"puerta"));Object.values(Q1.gates||{}).forEach(q=>reg(q,"puerta"));reg(Q1.apertura,"puerta");L_(Q1.jefeB).forEach(q=>reg(q,"jefe"));
L_(Q2.pasto).forEach(q=>reg(q,"pasto"));L_(Q2.puertas).forEach(q=>reg(q,"puerta"));L_(Q2.entrenadores).forEach(q=>reg(q,"serie"));L_(Q2.jefeC).forEach(q=>reg(q,"jefe"));
const PASTO=Object.values(ALL).filter(q=>q._src==="pasto");
const MCQPOOL=Object.values(ALL).filter(q=>q._src==="puerta");
function series(id){return Object.values(ALL).filter(q=>q.serie_id===id).sort((a,b)=>a.orden-b.orden)}
const STOP=new Set("de la el en y a los las del con por para que un una se su al o es más como sin lo".split(" "));
const toks=s=>new Set(String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(w=>w.length>3&&!STOP.has(w)));
/* reservadas: series de entrenadores y preguntas del jefe; el resto del banco del nivel entra a las puertas */
const RESV=new Set(),RESS=new Set();STORY.zones.forEach(z=>z.trainers.forEach(t=>{if(t.serie)RESS.add(t.serie)}));STORY.boss.phases.forEach(P=>{(P.questions||[]).forEach(id=>{RESV.add(id);if(ALL[id]&&ALL[id].serie_id)RESS.add(ALL[id].serie_id)});(P.series||[]).forEach(s=>RESS.add(s))});
const MCQX=MCQPOOL.concat(Object.values(ALL).filter(q=>(q._src==="pasto"&&!q.vf)||(q._src==="banco"&&!RESV.has(q.id)&&!RESS.has(q.serie_id))));
function topicPick(topics,n,used){const T0=toks(topics.join(" "));const sc=MCQX.map(q=>{const t=toks(q.enunciado+" "+(q.tema||"")+" "+(q.subtema||"")+" "+(q.perla||""));let s=0;t.forEach(w=>{if(T0.has(w))s++});return{q,s:s+Math.random()*.5-(used.has(q.id)?3:0)}}).sort((a,b)=>b.s-a.s);return sc.slice(0,n).map(x=>x.q)}
/* asignación de entrenadores y puertas */
/* serie de cada entrenador: trainers[].serie (si falta, preguntas por tema) */
const SERIE_OF={};STORY.zones.forEach(z=>z.trainers.forEach(t=>{if(t.serie)SERIE_OF[t.id]=t.serie}));
const PLAN={};(()=>{const used=new Set();
 STORY.zones.forEach((z,zi)=>{z.trainers.forEach(t=>{let qs=SERIE_OF[t.id]?series(SERIE_OF[t.id]):[];if(!qs.length)qs=topicPick(t.questionTopics||[t.specialty],t.n||3,used);qs.forEach(q=>used.add(q.id));PLAN[t.id]=qs.map(q=>q.id)});
  z.gates.forEach((g,gi)=>{const qs=topicPick([g.topic],3,used);qs.forEach(q=>used.add(q.id));PLAN["g_"+zi+"_"+gi]=qs.map(q=>q.id)})});
 /* preguntas del jefe por fase: boss.phases[i].questions (ids), .series (series completas) y .pick {topics,n} */
 PLAN.boss=STORY.boss.phases.map(P=>{const ids=(P.questions||[]).filter(id=>ALL[id]);(P.series||[]).forEach(s=>series(s).forEach(q=>ids.push(q.id)));
  if(P.pick){const ex=topicPick(P.pick.topics||P.topics||[],P.pick.n||2,used);ex.forEach(q=>used.add(q.id));ids.push(...ex.map(q=>q.id))}
  if(!ids.length)ids.push(...topicPick(P.topics||[P.name],3,used).map(q=>q.id));return ids})})();
/* repetición espaciada corregida */
const BOXD=[1,3,7,14,21];let sessQ=[],sessN=0;
function grade(q,ok){const now=Date.now(),r=S.srs[q.id]||{b:-1,due:0};const wasDue=r.b<0||r.due<=now;
 if(ok){if(wasDue){r.b=Math.min(r.b+1,BOXD.length-1);r.due=now+BOXD[r.b]*864e5}}
 else{r.b=0;r.due=now+864e5;sessQ.push({id:q.id,at:sessN+3+(Math.random()*3|0)})}
 r.last=ok?1:0;S.srs[q.id]=r;S.stats.n++;if(ok)S.stats.ok++;sessN++;save();hud()}
function nextPasto(){const now=Date.now();const i=sessQ.findIndex(s=>s.at<=sessN);if(i>=0){const id=sessQ.splice(i,1)[0].id;return ALL[id]}
 const due=PASTO.filter(q=>S.srs[q.id]&&S.srs[q.id].due<=now);if(due.length)return due[Math.random()*due.length|0];
 const fresh=PASTO.filter(q=>!S.srs[q.id]);if(fresh.length)return fresh[Math.random()*fresh.length|0];return PASTO[Math.random()*PASTO.length|0]}
function dueCount(){const now=Date.now();return Object.entries(S.srs).filter(([id,r])=>r.due<=now&&ALL[id]).length}
/* ================= audio, voz, vibración, alerta ================= */
let AC=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}
 try{if(navigator.wakeLock&&!window._wl)navigator.wakeLock.request("screen").then(l=>{window._wl=l;l.addEventListener("release",()=>{window._wl=null})}).catch(()=>{})}catch(e){}}
function beep(f=660,d=.1,t="square",v=.08){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02)}catch(e){}}
const sfx={ok(){beep(880,.07);setTimeout(()=>beep(1320,.1),70)},bad(){beep(140,.25,"sawtooth",.07)},lvl(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.1,"triangle"),i*90))},hit(){beep(200,.08,"square",.1)},step(){beep(120,.02,"triangle",.03)},bump(){beep(90,.05,"square",.05)},enc(){[300,500,300,700].forEach((f,i)=>setTimeout(()=>beep(f,.06),i*60))}};
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function say(t){if(!S.voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-MX";u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
$("#bVoz").onclick=()=>{S.voice=!S.voice;save();$("#bVoz").textContent=S.voice?"VOZ ✓":"VOZ"};$("#bVoz").textContent=S.voice?"VOZ ✓":"VOZ";
let idleT=null,alertOn=false,tgtHits=0,alertIv=[];
function idleLimit(){return (S.idle+Math.min(40,words(pn.innerText).length*.25))*1000}
function poke(){unlockAudio();if(alertOn)return;clearTimeout(idleT);idleT=setTimeout(fireAlert,idleLimit())}
["pointerdown","keydown"].forEach(e=>addEventListener(e,poke,{passive:true}));
function fireAlert(){alertOn=true;S.alerts++;save();tgtHits=0;$("#alert").classList.add("on");const t=$("#tgt");
 const mv=()=>{t.style.left=(10+Math.random()*(innerWidth-110))+"px";t.style.top=(38+Math.random()*45)+"vh"};mv();
 alertIv=[setInterval(mv,900),setInterval(()=>{beep(1200,.15,"square",.14);setTimeout(()=>beep(900,.15,"square",.14),180);vib([200,100,200])},700)]}
$("#tgt").onpointerdown=e=>{e.stopPropagation();unlockAudio();tgtHits++;beep(1500,.05);$("#tgt").textContent=(3-tgtHits)||"OK";
 if(tgtHits>=3){alertOn=false;alertIv.forEach(clearInterval);$("#alert").classList.remove("on");$("#tgt").textContent="AQUÍ";poke();if(MODE!=="battle"&&MODE!=="river"&&MODE!=="wake"){const d=document.createElement("div");d.className="modal";d.innerHTML='<div class="box"><div class="who">¿TIENES SUEÑO?</div>'+(S.alerts%3===0?"Llevas "+S.alerts+" alertas. Considera una pausa activa de pie. ":"")+'Un minijuego rápido de 1 minuto puede despertarte.<div class="row"><button class="btn" id="wk">😴 DESPERTADOR</button><button class="btn alt" id="nw">SEGUIR</button></div></div>';document.body.appendChild(d);d.querySelector("#wk").onclick=()=>{d.remove();wake()};d.querySelector("#nw").onclick=()=>d.remove()}}};
poke();
/* ================= HUD / modales ================= */
function need(l){return Math.round(20*Math.pow(l,1.5))}
function hud(){const a=active();$("#h1").textContent=a?(cName(a).slice(0,12)+" Nv"+a.lvl):"—";$("#h2").textContent=a?("PS "+a.hp+"/"+a.max):"";const d=dueCount();$("#h3").textContent=(d?"REP "+d+" · ":"")+"✓"+S.stats.ok+"/"+S.stats.n}
function modal(html,cb,btn="OK"){const d=document.createElement("div");d.className="modal";d.innerHTML='<div class="box">'+html+'<div class="row"><button class="btn">'+btn+'</button></div></div>';document.body.appendChild(d);const b=d.querySelector("button");KEYA=()=>b.click();b.onclick=()=>{d.remove();KEYA=null;cb&&cb()}}
let KEYA=null;
/* ================= canvas ================= */
const cv=$("#cv");let cx=cv.getContext("2d");
function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function circ(x0,y0,r,c){cx.fillStyle=c;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));cx.fillRect(Math.round(x0-w),Math.round(y0+y),w*2+1,1)}}
/* ================= ARTE: sprites con contorno (pixel art a baja resolución, vista cenital) =================
   Cada sprite se dibuja una vez en un lienzo pequeño con px/circ, se le añade contorno de 1 px y se guarda en caché. */
const SPR={},OL=[32,28,44];
function tint(c,k){if(c.length===4)c="#"+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];const n=parseInt(c.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))));return"#"+((f(n>>16)<<16)|(f((n>>8)&255)<<8)|f(n&255)).toString(16).padStart(6,"0")}
